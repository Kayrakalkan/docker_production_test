version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - network.host=0.0.0.0
      - http.host=0.0.0.0
      - xpack.security.enabled=false
    ports:
      - 9200:9200  # Dış dünyaya açılıyor
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - elasticnet

  flaskapp:
    build: ./app
    container_name: flaskapp
    ports:
      - 5050:5050
    depends_on:
      - elasticsearch
    networks:
      - elasticnet

volumes:
  esdata:
    driver: local

networks:
  elasticnet:
    driver: bridge
